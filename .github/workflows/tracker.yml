name: Coin Tracker

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 min (GitHub peut décaler de quelques minutes)
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main
  push:                      # relance immédiate quand le code ou la config change
    branches: [main]
    paths: ["tracker.py", "config.json", "scanner.py", "scanner_config.json", "paper_trader.py", "paper_config.json", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: coin-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check des coins
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python tracker.py --cron
      - name: Scanner des coins qui démarrent
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scanner.py
      - name: Paper trading (simulation, aucun vrai SOL)
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python paper_trader.py
      - name: Sauvegarde de l'état
        run: |
          git config user.name "coin-tracker-bot"
          git config user.email "coin-tracker-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "maj état" -q
          git pull --rebase -q && git push -q
